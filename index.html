<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>AI Agent</title>
    <!-- stlite CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.63.1/build/stlite.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- stlite JS -->
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.63.1/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["google-genai>=0.2.0", "python-dotenv>=1.0.0", "requests>=2.31.0"],
          entrypoint: "app.py",
          files: {
            "app.py": { url: "app.py" },
            "agent.py": { url: "agent.py" },
            "tools.py": { url: "tools.py" },
            "safety.py": { url: "safety.py" },
            "prompts.py": { url: "prompts.py" }
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
